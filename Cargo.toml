[package]
name = "slope"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/SisyphusAeolides/Slope"
description = "Capability-oriented userspace ABI and runtime library for Arach OS"
build = "build.rs"

[features]
default = []
fortran-policy = []

[lib]
path = "src/lib.rs"

[dependencies]
aether = { git = "https://github.com/SisyphusAeolides/Arach-Kernel.git", rev = "c5c19df6fd8b69937220165b3147c0e825af270b" }
kairos = { git = "https://github.com/SisyphusAeolides/Arach-Kernel.git", rev = "c5c19df6fd8b69937220165b3147c0e825af270b" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
